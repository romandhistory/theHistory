<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена — theХистори</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="/img/logo1.png" />
    <link rel="shortcut icon" href="/img/logo1.png" type="image/png" />
    <link rel="apple-touch-icon" href="/img/logo1.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: "Montserrat", sans-serif;
            background-color: #1c1c1e;
            color: #a0a0a5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .bg-wrap {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background-color: #1c1c1e;
        }

        .bg-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            opacity: 0.18;
        }

        .page {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.25rem 6rem;
        }

        .brand {
            font-family: "Playfair Display", serif;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 2.5rem;
            text-decoration: none;
        }

        .brand .prefix {
            display: block;
            font-family: "Montserrat", sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: -0.5rem;
            letter-spacing: 0.02em;
        }

        .brand .main {
            display: block;
            font-size: clamp(2.2rem, 4vw, 3.2rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #f3f4f6;
        }

        .code {
            font-family: "Playfair Display", serif;
            font-weight: 900;
            font-size: clamp(5rem, 18vw, 9rem);
            line-height: 1;
            color: #14a6f4;
            letter-spacing: 0.04em;
        }

        .message {
            max-width: 34rem;
            margin: 1rem 0 2.2rem;
        }

        .message h1 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: 0.6rem;
        }

        .message p {
            font-size: 0.98rem;
            color: #9ca3af;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 9rem;
            padding: 0.65rem 1.4rem;
            border-radius: 999px;
            font-size: 0.9rem;
            text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        .btn-primary {
            background: #14a6f4;
            color: #ffffff;
            border: 1px solid #14a6f4;
        }

        .btn-primary:hover {
            background: #0f8fd6;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: #f3f4f6;
            border: 1px solid #4b5563;
        }

        .btn-secondary:hover {
            background: #f3f4f6;
            color: #111827;
            transform: translateY(-1px);
        }

        .site-footer {
            padding: 1.1rem 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: #9ca3af;
        }

        .site-footer a {
            color: inherit;
        }
    </style>
</head>

<body>
    <div class="bg-wrap">
        <img src="/img/fon.webp" alt="" />
    </div>

    <main class="page">
        <a class="brand" href="/">
            <span class="prefix">the</span>
            <span class="main">ХИСТОРИ</span>
        </a>

        <div class="code">404</div>

        <div class="message">
            <h1>Такой страницы не нашлось</h1>
            <p>Возможно, ссылка устарела или событие переехало. Вернись на главную страницу и найди нужный год через цифровой поток.</p>
        </div>

        <div class="actions">
            <a class="btn btn-primary" href="/">На главную</a>
            <a class="btn btn-secondary" href="https://t.me/historyflow/" target="_blank" rel="noopener noreferrer">Telegram-канал</a>
        </div>
    </main>

    <footer class="site-footer">
        © 2025-2026 theХистори · <a href="/">thehistory.pro</a>
    </footer>
</body>

</html>
