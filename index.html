    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "Organization",
                    "name": "theХистори",
                    "url": "https://thehistory.pro/",
                    "logo": "https://thehistory.pro/img/logo1.png",
                    "image": "https://thehistory.pro/img/logo1.png",

                {
                    "@type": "WebSite",
                    "name": "theХистори",
                    "url": "https://thehistory.pro/",
                    "inLanguage": "ru",
                    "publisher": {
                        "@type": "Organization",
                        "name": "theХистори",
                        "logo": "https://thehistory.pro/img/logo1.png"
                    },
                    "potentialAction": {
                        "@type": "SearchAction",
                        "target": "https://thehistory.pro/?s={search_term_string}",
                        "query-input": "required name=search_term_string"
                    }
                }
            ]
        }

<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="header-actions">
                <button type="button" class="header-btn" id="mainBtn">Main</button>
                <button type="button" class="header-btn" id="logBtn"><ion-icon name="power"></ion-icon> Log</button>
            </div>
        </div>
    </header>
    <div class="bg-wrap">
        <img src="img/fon.webp" alt="" class="bg-img" />
    </div>
    <section id="tranding">
        <div class="container">
            <h1 class="section-heading">
                <a class="section-heading__link" href="#">
                    <span class="prefix">the</span>
                    <span class="main">ХИСТОРИ</span>
                    <span class="subtitle">от средневековья до наших дней</span>
                </a>
            </h1>
        </div>
        <div class="container"> 
            <div class="slider-wrapper">
                <div class="swiper tranding-slider">
                    <div class="swiper-wrapper" id="slidesRoot"></div>
                </div>
                <div class="slider-controls">
                    <button class="slide-arrow slide-arrow-prev" type="button" aria-label="Предыдущий год">
                        <ion-icon name="chevron-back-outline"></ion-icon>
                    </button>
                    <div class="search-container">
                        <input type="text" class="slide-search" placeholder="Выберите нужный Год" maxlength="4">
                    </div>
                    <button class="slide-arrow slide-arrow-next" type="button" aria-label="Следующий год">
                        <ion-icon name="chevron-forward-outline"></ion-icon>
                    </button>
                </div>
            </div>
        </div>
    </section>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Подробности о слайде</h2>
                <button class="modal-close" aria-label="Закрыть">×</button>
            </div>
            <div class="modal-content" id="modalContent"></div>
            <div class="modal-tabs">
                <button class="tab-button active" data-tab="tab1">Мировые События</button>
                <button class="tab-button" data-tab="tab2">Россия</button>
                <button class="tab-button" data-tab="tab3">Галерея</button>
            </div>
        </div>
    </div>
    <script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/ionicons/5.5.2/ionicons/ionicons.esm.js"></script>

    <script src="scr.js"></script>

                <div class="site-footer__sub">Все права защищены</div>
            </div>
            <div class="site-footer__social" aria-label="Социальные ссылки">
                <a href="https://t.me/historyflow/" class="social-btn" aria-label="Telegram" data-tooltip="Telegram" target="_blank" rel="noopener noreferrer">
